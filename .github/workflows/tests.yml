name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./Python pytest streamlit plotly pandas
      - name: Python package tests (Matlab references required)
        working-directory: Python
        env:
          SEAFREEZE_REQUIRE_MATLAB_REF: "1"
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: GUI tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q SeaFreezeGUI/tests
